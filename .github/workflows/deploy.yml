name: Deploy to GitHub Pages

on:
  push:
  workflow_dispatch:
  # While Pages is still set to "Deploy from a branch", GitHub also publishes
  # the raw branch on every push. Deploying again once that finishes keeps the
  # built site on top. Once Source is set to "GitHub Actions" this never fires.
  page_build:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
