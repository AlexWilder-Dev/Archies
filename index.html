    <script>
      (function () {
        try {
          var s = sessionStorage.getItem('archies-mode')
          if (s === 'day' || s === 'evening') { document.documentElement.dataset.mode = s; return }
        } catch (e) {}
        try {
          var p = {}
          new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/London', weekday: 'short', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' })
            .formatToParts(new Date()).forEach(function (x) { p[x.type] = x.value })
          var late = ['Wed', 'Thu', 'Fri', 'Sat'].indexOf(p.weekday) > -1
          var mins = Number(p.hour) * 60 + Number(p.minute)
          document.documentElement.dataset.mode = late && mins >= 1050 ? 'evening' : 'day'
        } catch (e) {}
      })()
    </script>

    <script>
    (() => {
      try {
        if (location.hash === '#me') localStorage.setItem('me', '1');
        if (localStorage.getItem('me') || sessionStorage.getItem('pinged')) return;
        sessionStorage.setItem('pinged', '1');
      } catch (e) {}
      const v = new URLSearchParams(location.search).get('v') || 'untagged';
      fetch('https://ntfy.sh/YOUR-NTFY-TOPIC', {
        method: 'POST', body: `${v} opened ${location.pathname}`, keepalive: true
      }).catch(() => {});
    })();
    </script>
